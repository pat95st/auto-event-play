[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoeventplay"
version = "1.0.0"
description = "Lokaler Event-Audio-Player für eventrentmanager (Raspberry Pi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
tts = ["piper-tts"]
dev = ["pytest>=8"]

[project.scripts]
autoeventplay = "autoeventplay.__main__:main"

[tool.setuptools.packages.find]
include = ["autoeventplay*"]

[tool.setuptools.package-data]
autoeventplay = ["web/templates/*.html", "web/static/css/*", "web/static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
