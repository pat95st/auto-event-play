{% extends "base.html" %}
{% block content %}
<div class="row g-3">
  <div class="col-xl-6">
    <div class="aep-panel">
      <div class="aep-panel-head"><span>{{ _("System") }}</span></div>
      <div class="aep-panel-body"><dl class="row mb-0 small" id="info"></dl></div>
    </div>
  </div>
  <div class="col-xl-6 d-flex flex-column gap-3">
    <div class="aep-panel">
      <div class="aep-panel-head"><span>{{ _("Change password") }}</span></div>
      <div class="aep-panel-body">
        <form id="pw-form" class="row g-2">
          <div class="col-12"><label class="form-label">{{ _("Current password") }}</label><input class="form-control" type="password" name="current_password" autocomplete="current-password" required></div>
          <div class="col-md-6"><label class="form-label">{{ _("New password") }}</label><input class="form-control" type="password" name="new_password" minlength="8" autocomplete="new-password" required></div>
          <div class="col-md-6"><label class="form-label">{{ _("Repeat") }}</label><input class="form-control" type="password" name="new_password2" minlength="8" autocomplete="new-password" required></div>
          <div class="col-12"><button class="btn btn-console" type="submit">{{ _("Change") }}</button></div>
        </form>
      </div>
    </div>
    <div class="aep-panel">
      <div class="aep-panel-head"><span>{{ _("Language") }}</span></div>
      <div class="aep-panel-body">
        <div class="d-flex gap-2 align-items-center">
          <select class="form-select w-auto" id="ui-lang">{% for code, name in languages.items() %}<option value="{{ code }}" {{ 'selected' if code == lang }}>{{ name }}</option>{% endfor %}</select>
          <button class="btn btn-console" id="btn-lang">{{ _("Apply") }}</button>
        </div>
        <div class="form-text">{{ _("Language of the web interface for all users. English is the default.") }}</div>
      </div>
    </div>
    <div class="aep-panel">
      <div class="aep-panel-head"><span>{{ _("Architecture (CQRS)") }}</span></div>
      <div class="aep-panel-body small" id="cqrs"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const T = AEP.t;
  document.getElementById("btn-lang").addEventListener("click", async () => {
    await AEP.run(() => AEP.api("/api/ui/language", { language: document.getElementById("ui-lang").value }));
    location.reload();
  });
  AEP.api("/api/system").then((d) => {
    const up = d.uptime_s, h = Math.floor(up / 3600), m = Math.floor((up % 3600) / 60);
    const rows = [[T("Version"), d.version], [T("Host name"), d.hostname], [T("IP addresses"), d.ip_addresses.join(", ") || "—"], [T("Platform"), d.platform], ["Python", d.python],
      [T("Uptime"), `${h} h ${m} min`], [T("Data directory"), d.data_dir], [T("Free disk space"), d.disk_free_mb + " MB"], [T("Users"), d.users.join(", ")]];
    document.getElementById("info").innerHTML = rows.map((r) => `<dt class="col-sm-4 text-dim fw-normal">${r[0]}</dt><dd class="col-sm-8 mono">${AEP.esc(r[1])}</dd>`).join("");
    document.getElementById("cqrs").innerHTML = `<p class="mb-2">${AEP.esc(T("Writing actions run as commands, reading ones as queries, over separate buses."))}</p>
      <div class="mb-1 text-dim">Commands (${d.commands.commands.length})</div><div class="mono mb-2">${d.commands.commands.map(AEP.esc).join(", ")}</div>
      <div class="mb-1 text-dim">Queries (${d.commands.queries.length})</div><div class="mono">${d.commands.queries.map(AEP.esc).join(", ")}</div>`;
  });
  document.getElementById("pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (e.target.new_password.value !== e.target.new_password2.value) { AEP.toast(T("The new passwords do not match"), "err"); return; }
    await AEP.run(() => AEP.api("/api/account/password", { current_password: e.target.current_password.value, new_password: e.target.new_password.value }), T("Password changed"));
    e.target.reset();
  });
})();
</script>
{% endblock %}
